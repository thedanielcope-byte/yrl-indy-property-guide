name: Sync agent expertise from hub

# Publishes broker edits (Specialties + Service Areas) made in the YRL hub
# agent directory to the public site — no manual push needed.
#
# Triggers:
#   • schedule        — polls the hub once a day (08:00 UTC ≈ 3–4am ET)
#   • workflow_dispatch — manual "Run workflow" button (use for an instant sync)
#   • repository_dispatch (type: hub-updated) — reserved for an instant
#     trigger from the hub (future upgrade: hub Save → edge fn → dispatch)

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [hub-updated]

permissions:
  contents: write

concurrency:
  group: sync-agents
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install image optimizer (Pillow)
        # sync-roster.py optimizes new hub headshots to ~600px JPEGs. macOS uses the
        # built-in `sips`; this Linux runner has no `sips`, so it uses Pillow instead.
        run: pip install --quiet Pillow

      - name: Pull hub roster + rebuild agent pages
        run: |
          python3 sync-roster.py
          python3 inject_city_agents.py
          python3 build_homepage_cities.py
          python3 bump-assets.py

      - name: Commit & push if anything changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Auto-sync agent expertise/areas from hub"
            git push
            echo "Published hub changes."
          else
            echo "No changes — hub and site already in sync."
          fi
